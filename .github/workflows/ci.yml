name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        run: |
          npm install --global --ignore-scripts --registry https://registry.npmjs.org pnpm@10.26.0
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate every new commit message
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = 'pull_request' ]]; then
            commit_args=("$PR_HEAD_SHA" "^$PR_BASE_SHA")
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] &&
            git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null &&
            git merge-base --is-ancestor "$EVENT_BEFORE" "$GITHUB_SHA"; then
            commit_args=("$GITHUB_SHA" "^$EVENT_BEFORE")
          else
            commit_args=("$GITHUB_SHA")
          fi

          message_file="$RUNNER_TEMP/commit-message.txt"
          git rev-list --reverse "${commit_args[@]}" | while read -r commit; do
            git show -s --format=%B "$commit" > "$message_file"
            pnpm exec commitlint --edit "$message_file"
            node packages/mcp/scripts/git-hooks/reject-agent-attribution.mjs "$message_file"
            node packages/mcp/scripts/git-hooks/reject-agent-identity.mjs --commit "$commit"
          done

      - name: Reject non-public identities in reachable history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = 'pull_request' ]]; then
            history_ref="$PR_HEAD_SHA"
          else
            history_ref="$GITHUB_SHA"
          fi
          node scripts/verify-public-history.mjs --ref "$history_ref"

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out dependency manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy --component rustfmt
          rustup show active-toolchain

      - name: Install the pinned package manager
        run: |
          npm install --global --ignore-scripts --registry https://registry.npmjs.org pnpm@10.26.0
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify all workspaces
        run: pnpm run verify

      - name: Verify the Rust runtime probe
        run: pnpm run verify:native

      - name: Verify the Web and MCP contract
        run: pnpm run verify:integration

      - name: Smoke test the stdio server
        run: pnpm run smoke:mcp

      - name: Preview the MCP package boundary
        run: pnpm run pack:mcp

  container:
    name: Container acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        run: |
          npm install --global --ignore-scripts --registry https://registry.npmjs.org pnpm@10.26.0
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the corpus contract
        run: pnpm --filter @sumi-os/corpus-contract build

      - name: Build the sealed machine projection once
        run: |
          node apps/web/scripts/build-machine-projection.mjs \
            --output artifacts/machine-projection \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"

      - name: Build the reviewed image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-context corpus=artifacts/machine-projection/_mcp \
            --file Dockerfile.mcp \
            --target production \
            --tag sumi-docs-mcp:acceptance \
            .
          test "$(docker image inspect sumi-docs-mcp:acceptance --format '{{.Config.User}}')" = 'node'

      - name: Exercise the hardened container boundary
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --publish 127.0.0.1:3000:3000 \
            sumi-docs-mcp:acceptance)"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker inspect "$container_id" --format '{{.HostConfig.ReadonlyRootfs}}')" = 'true'
          docker inspect "$container_id" --format '{{json .HostConfig.CapDrop}}' | grep -q 'ALL'
          docker inspect "$container_id" --format '{{json .HostConfig.SecurityOpt}}' | grep -q 'no-new-privileges'

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/readyz > ready.json; then
              break
            fi
            if [[ "$attempt" = '30' ]]; then
              exit 1
            fi
            sleep 1
          done
          corpus_revision="$(jq -r .revision artifacts/machine-projection/_mcp/v2/current.json)"
          jq --arg revision "$GITHUB_SHA" --arg corpus "$corpus_revision" -e \
            '.status == "ready" and .corpus.documentCount > 0 and .buildRevision == $revision and .corpus.revision == $corpus' \
            ready.json

          curl --fail --silent --show-error \
            --header 'Host: localhost:3000' \
            http://127.0.0.1:3000/healthz > localhost-health.json
          jq -e '.status == "ok"' localhost-health.json

          curl --fail --silent --show-error \
            --dump-header response-headers.txt \
            --header 'accept: application/json, text/event-stream' \
            --header 'content-type: application/json' \
            --header 'mcp-protocol-version: 2026-07-28' \
            --header 'mcp-method: tools/list' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"sumi-docs-container-ci","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' \
            http://127.0.0.1:3000/mcp > tools-list.json
          jq -e '[.result.tools[].name] | sort == ["fetch_doc","get_openapi_spec","list_docs","search_docs"]' tools-list.json
          grep -qi '^x-content-type-options: nosniff' response-headers.txt
          if grep -qi '^mcp-session-id:' response-headers.txt; then
            exit 1
          fi

          docker stop --time 10 "$container_id" >/dev/null
          test "$(docker inspect "$container_id" --format '{{.State.ExitCode}}')" = '0'
