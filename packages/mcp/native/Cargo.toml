[package]
name = "sumi-docs-mcp-native-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "R1 stdio protocol probe for the Sumi Docs native runtime"
license = "MIT"

[dependencies]
anyhow = "1.0"
markdown = "1.0.0"
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
